name: merge

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  verify:
    name: ${{ matrix.check }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Every check runs even when an earlier one fails, so a push reports all its
      # problems at once rather than one per re-run.
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build]
        node: ["26"]
        include:
          # Exercise current releases as well as jsdom's exact Node floors.
          - check: test
            node: "22"
          - check: test
            node: "24"
          - check: test
            node: "22.22.2"
          - check: test
            node: "24.15.0"
          - check: test
            node: "26.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: npm run typecheck
      - name: Test
        if: matrix.check == 'test'
        run: npm run test
      - name: Build
        if: matrix.check == 'build'
        run: npm run build

  commitlint:
    # Pull requests only: on a direct push the range below is not meaningful, and the
    # commit-msg hook has already checked the message locally.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release derives the version from the commit messages, so a
          # non-conventional message on main would silently produce no release.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint commit messages
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
